[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
  "E501",   # long lines are handled by the formatter
  "B008",   # Streamlit/argparse patterns
  "SIM117", # nested with is sometimes clearer for TLS
]

[tool.ruff.lint.per-file-ignores]
"app.py" = ["E402"]
"tests/*" = ["S101"]
